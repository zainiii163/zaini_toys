services:
  - type: web
    name: toy-ecommerce
    runtime: node
    plan: free
    buildCommand: npm install -g pnpm && pnpm install && pnpm build:prod
    startCommand: pnpm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 15m
      - key: JWT_REFRESH_EXPIRE
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: COOKIE_DOMAIN
        sync: false
    healthCheckPath: /health
