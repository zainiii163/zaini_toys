version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: toy-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: toy-ecommerce

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: toy-api
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/toy-ecommerce
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-32-chars-min}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh-32-chars-min}
      JWT_EXPIRE: 15m
      JWT_REFRESH_EXPIRE: 7d
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      CUSTOMER_URL: ${CUSTOMER_URL:-http://localhost:5173}
      ADMIN_URL: ${ADMIN_URL:-http://localhost:5174}
      API_URL: ${API_URL:-http://localhost:5000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: toy-web
    ports:
      - "5173:80"
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: toy-admin
    ports:
      - "5174:80"
    depends_on:
      - api

volumes:
  mongodb_data:
